name: Build journal artwork
on:
  push:
    paths:
      - ".github/workflows/media.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate TGA textures
        run: python3 tools/generate_media.py
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Media/*.tga
          if ! git diff --cached --quiet; then
            git commit -m "Add generated journal background artwork"
            git push
          fi
