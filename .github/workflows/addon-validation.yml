name: Validate WoW addon
on:
  push:
    paths:
      - '*.lua'
      - '*.toc'
      - 'Media/**'
      - 'tools/test_minimap.lua'
      - 'tools/test_sync.lua'
      - 'tools/test_storage.lua'
      - 'tools/test_crafting.lua'
      - 'tools/test_rarity.lua'
      - 'tools/test_social.lua'
      - 'tools/test_modern_ui.lua'
      - '.github/workflows/addon-validation.yml'
  pull_request:
    paths:
      - '*.lua'
      - 'tools/test_social.lua'
      - '*.toc'
      - 'Media/**'
      - 'tools/test_minimap.lua'
      - '.github/workflows/addon-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua compiler
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse every addon Lua file
        run: |
          set -eu
          for file in Core.lua Theme.lua UI.lua Minimap.lua Sync.lua Crafting.lua Social.lua ModernSettings.lua; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done
      - name: Test minimap launcher behavior
        run: lua5.1 tools/test_minimap.lua
      - name: Test cross-zone party loot synchronization
        run: lua5.1 tools/test_sync.lua
      - name: Test saved-loot storage presets
        run: lua5.1 tools/test_storage.lua
      - name: Test crafting recipe scanner
        run: lua5.1 tools/test_crafting.lua
      - name: Test rarity registration without deleting old records
        run: lua5.1 tools/test_rarity.lua
      - name: Test right-click player context menu
        run: lua5.1 tools/test_social.lua
      - name: Test D-style modern WoW settings and navigation
        run: lua5.1 tools/test_modern_ui.lua
      - name: Check addon manifest and images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          toc = Path('ForeverLootJournal.toc').read_text(encoding='utf-8')
          assert '## Interface: 16001' in toc
          for name in [x.strip() for x in toc.splitlines() if x.strip() and not x.startswith('##')]:
              assert (Path(name)).is_file(), f"Missing add-on script: {name}"
          for name in ['banner.tga', 'detail.tga', 'paper.tga']:
              image = Path('Media') / name
              data = image.read_bytes()
              assert len(data) > 18, f"Missing image data: {image}"
              assert data[2] == 2, f"Unexpected TGA format: {image}"
              width, height = unpack('<HH', data[12:16])
              assert width and height, f"Invalid TGA dimensions: {image}"
          icon = Path('Media/minimap_button.tga').read_bytes()
          assert icon[2] == 2 and icon[16] == 32, "Minimap button must be 32-bit TGA"
          width, height = unpack('<HH', icon[12:16])
          assert len(icon) == 18 + width * height * 4, "Truncated minimap artwork"
          assert icon[17] & 0x0F == 8, "Minimap art requires 8-bit transparency"
          assert icon[18 + 3] == 0, "Minimap artwork has an opaque square corner"
          center_alpha = icon[18 + (height//2 * width + width//2)*4 + 3]
          assert center_alpha == 255, "Minimap artwork is transparent in the center"
          header = Path('Media/modern_header.tga').read_bytes()
          assert header[2] == 2 and header[16] == 32, "Modern banner must be 32bit TGA"
          width, height = unpack('<HH', header[12:16])
          assert width == 1024 and height == 128, f"Banner dimensions: {width}x{height}"
          assert len(header) == 18 + width * height * 4
          ui = Path('UI.lua').read_text(encoding='utf-8')
          core = Path('Core.lua').read_text(encoding='utf-8')
          assert 'EXTREME!!' in core and 'limit=10000' in core
          assert 'FLJ.RarityOptions=RARITIES' in core and 'RegistrationAllowed' in core
          settings = Path('ModernSettings.lua').read_text(encoding='utf-8')
          assert 'MakeRarities(rarity,true)' in settings
          assert 'Previously saved items are never removed.' in settings
          assert 'MakeStorage(store)' in settings
          assert 'FLJ_MODERN_STORAGE_CONFIRM' in settings
          assert 'SelectGearFilter("crafting")' in ui and 'MakeCraftingPane(frame)' in ui
          craft = Path('Crafting.lua').read_text(encoding='utf-8')
          assert 'recipeID="loot-"' in craft and 'Craft.GetDrops' in craft
          assert 'GetAllRecipeIDs' not in craft and 'BuildGeneral' not in settings
          assert 'MinimapShortcut()' not in ui, 'Legacy minimap button must not be instantiated'
          assert 'f_header' in ui and 'FLJ.SettingsUI.Build(frame)' in ui
          for name in ['f_item_ring','f_icon_well','f_circle_mask','f_check','f_row_selected','f_row_hover','f_header']:
              data = Path('Media',name+'.tga').read_bytes()
              assert data[2] == 2 and data[16] == 32, f'Invalid front-page artwork: {name}'
          for name in ['d_panel','d_window','d_button','d_active','d_card','d_glow','d_crest','d_journal_crest','d_selected','d_monitor','d_display']:
              data = Path('Media',name+'.tga').read_bytes()
              assert data[2] == 2 and data[16] == 32, f'Invalid option D artwork: {name}'
          assert 'Theme.lua' in toc
          assert Path('ModernSettings.lua').exists() and Path('tools/test_modern_ui.lua').exists()
          assert Path('Media/modern_header.tga').exists()
          assert 'r:RegisterForClicks("LeftButtonUp","RightButtonUp")' in ui
          assert 'FLJ.ShowPlayerContextMenu(self,self.player)' in ui
          assert 'if mouseButton=="RightButton" then' in ui
          assert 'SelectGearFilter("armor")' in ui and 'SelectGearFilter("weapons")' in ui
          assert 'frame:RegisterForDrag("LeftButton")' not in ui, 'Journal must be draggable only from title bar'
          print('Manifest, artwork and filter checks passed')
          PY

